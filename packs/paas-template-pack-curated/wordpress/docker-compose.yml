services:
  app:
    image: wordpress:6-apache
    restart: unless-stopped
    networks: [tenant]
    expose:
      - "80"
    mem_limit: 256m
    cpus: 0.5
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: {{RAND_HEX_24}}
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp_data:/var/www/html
    depends_on: [db]
  db:
    image: mariadb:11
    restart: unless-stopped
    networks: [tenant]
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: {{RAND_HEX_24}}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
networks:
  tenant:
    name: {{TENANT_NETWORK}}
volumes:
  wp_data:
  db_data:
