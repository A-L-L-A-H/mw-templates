services:
  app:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [tenant]
    expose:
      - "8090"
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - pb_data:/pb_data
networks:
  tenant:
    name: {{TENANT_NETWORK}}
volumes:
  pb_data:
