services:
  app:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [tenant]
    expose:
      - "3001"
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - kuma_data:/app/data
networks:
  tenant:
    name: {{TENANT_NETWORK}}
volumes:
  kuma_data:
